name: CI

on:
  push:
    branches: [release]
    tags: ["v*"]
  pull_request:
    branches: [release]
  workflow_dispatch:
    inputs:
      create_release:
        description: "创建 Release (仅在有可用 artifact 时生效)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -- 测试 (三平台) --
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux GUI 系统依赖
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - run: cargo test --verbose

  # -- 构建发布二进制 --
  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: fast-json.exe
            artifact: fast-json-windows-x86_64

          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: fast-json
            artifact: fast-json-linux-x86_64

          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-13
            binary: fast-json
            artifact: fast-json-macos-x86_64

          - name: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            binary: fast-json
            artifact: fast-json-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Linux 系统依赖 (含 multilib 支持)
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}.exe

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}

  # -- 自动发布 Release (仅 tag 推送时触发) --
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        run: |
          echo "## 变更" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --pretty=format:"- %s" --no-merges >> CHANGELOG.md 2>/dev/null || echo "- 首个版本" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
